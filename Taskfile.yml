version: "3"

# Local deploy is the chosen path (the GitHub Actions deploy job stays off unless
# CF_CI_DEPLOY is set). Config comes from the 1Password Environment `foolhearts-deploy`,
# mounted by the 1Password app at ./.env (gitignored; a pipe the app serves, not a file
# with values on disk). CLOUDFLARE_API_TOKEN there is an `op://` reference, not a value;
# `op run --env-file=.env` resolves it for the deploy, so the token exists only inside
# that process. If `.env` is missing, open 1Password → Developer → Environments →
# foolhearts-deploy → mount it here.

dotenv: [".env"]

vars:
  WORKER_URL: https://foolhearts-site.matpataki.workers.dev

tasks:
  dev:
    desc: Serve public/ locally with wrangler (no Cloudflare login needed)
    cmds:
      - npx wrangler dev

  check:
    desc: Assert every local ref on a running site returns 200 (URL defaults to the deployed Worker)
    cmds:
      - node scripts/check-local-refs.mjs {{.URL | default .WORKER_URL}}

  deploy:
    desc: Deploy the Worker, then smoke-check the deployed site
    cmds:
      - op run --env-file=.env -- npx wrangler deploy
      - scripts/smoke-deployed.sh {{.WORKER_URL}}
      - scripts/smoke-deployed.sh https://foolhearts.com
